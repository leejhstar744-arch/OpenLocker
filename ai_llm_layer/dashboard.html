<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>샌드박스 콘솔</title>
<style>
  /* ===== 디자인 토큰 =====
     이 프로젝트의 성격(온디바이스 보안 인프라 콘솔)에 맞춰,
     화려한 마케팅 톤이 아니라 "운영 콘솔/터미널" 느낌의 어두운 배경 + 모노스페이스를 기본으로 했다.
     상태 색상(초록/호박/빨강)은 세션 상태(completed/running/failed)를 즉각 구분하기 위한 실용적 선택.
  */
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --border: #232b34;
    --text: #d8e0e8;
    --text-dim: #6b7a89;
    --accent: #4ec9b0;       /* teal - 브랜드 시그니처 컬러, 아키텍처 다이어그램의 teal과 통일 */
    --accent-dim: #2b3f3c;
    --ok: #3fb950;
    --running: #d29922;
    --fail: #f85149;
    --mono: "SFMono-Regular", "Consolas", "Menlo", monospace;
    --sans: -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }
  header .sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    min-height: 0;
  }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
  }

  /* ---------- 좌측: 채팅 패널 ---------- */
  .chat-pane {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    min-height: 0;
  }
  .chat-log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 88%; }
  .msg.user { align-self: flex-end; text-align: right; }
  .msg .bubble {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.5;
    text-align: left;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent-dim); color: var(--text); }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg .meta { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 4px; }
  .msg .code {
    margin-top: 8px;
    background: #08090c;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    color: #9fe8d8;
  }
  .status-pill {
    display: inline-block;
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 2px 8px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .status-pill.running { background: rgba(210,153,34,.15); color: var(--running); }
  .status-pill.completed { background: rgba(63,185,80,.15); color: var(--ok); }
  .status-pill.failed, .status-pill.timeout, .status-pill.rejected { background: rgba(248,81,73,.15); color: var(--fail); }

  .chat-input {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .chat-input input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13.5px;
    font-family: var(--sans);
  }
  .chat-input input:focus { outline: none; border-color: var(--accent); }
  .chat-input button {
    background: var(--accent);
    color: #06110f;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  .chat-input button:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---------- 우측: 모니터링 패널 ---------- */
  .monitor-pane {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .monitor-header {
    padding: 14px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .monitor-header h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0;
    font-weight: 600;
  }
  .monitor-header .count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

  .resource-bar {
    margin: 0 20px 12px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .resource-bar b { color: var(--text); }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 0 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .session-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--panel);
  }
  .session-card .row1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 11.5px;
  }
  .session-card .sid { color: var(--text-dim); }
  .session-card .tool { color: var(--accent); font-weight: 600; margin-top: 4px; font-size: 12px; }
  .session-card .detail {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
  }
  .empty-hint {
    color: var(--text-dim);
    font-size: 12.5px;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>피지컬 AI 온디바이스 샌드박스 콘솔</h1>
  <div class="sub">gateway: <span id="gw-status">확인 중...</span></div>
</header>

<main>
  <!-- 좌측: 채팅 -->
  <section class="chat-pane">
    <div class="chat-log" id="chat-log">
      <div class="empty-hint">요청을 입력하면 AI/LLM → 백엔드/파이프라인 → 인프라/보안 계층을 거쳐 실행됩니다.</div>
    </div>
    <div class="chat-input">
      <input id="chat-text" type="text" placeholder="예: 1부터 10까지 더한 값을 출력해줘" />
      <button id="chat-send">전송</button>
    </div>
  </section>

  <!-- 우측: 모니터링 -->
  <section class="monitor-pane">
    <div class="monitor-header">
      <h2>세션 모니터링</h2>
      <span class="count" id="session-count">0건</span>
    </div>
    <div class="resource-bar">
      <span>CPU 코어: <b>0-1 LLM / 2-3 샌드박스</b></span>
      <span>동시 세션 상한: <b>2</b></span>
      <span>하드 타임아웃: <b>30초</b></span>
    </div>
    <div class="session-list" id="session-list">
      <div class="empty-hint">아직 실행된 세션이 없습니다.</div>
    </div>
  </section>
</main>

<script>
// =====================================================================
// 샌드박스 콘솔 프론트엔드
// =====================================================================
// 이 스크립트가 하는 일은 딱 두 가지다:
//   1) 채팅 입력 -> ai_llm_layer.py가 하던 역할(POST /v1/execute) -> 폴링 -> 결과 표시
//   2) 1초마다 GET /v1/sessions/all을 불러와 우측 모니터링 패널을 갱신
//
// 포인트: 이 프론트엔드는 LLM 호출 자체는 하지 않는다. LLM 호출(Ollama)은
// 여전히 Python(ai_llm_layer.py)의 책임이다. 하지만 데모/테스트 편의를 위해,
// 이 파일은 간단한 요청은 게이트웨이가 아니라 별도의 작은 로컬 프록시를 통해
// LLM까지 왕복하도록 구성한다 (아래 CHAT_ENDPOINT 참고).
const GATEWAY = "http://localhost:8080";

// 포인트: 브라우저에서 직접 Ollama(:11434)를 호출하는 것도 기술적으로는 가능하지만,
// 그러면 Tool Call 파서(tool_call_parser.py)의 검증을 건너뛰고 프론트엔드가
// 화이트리스트 없이 임의 응답을 게이트웨이로 보내는 셈이 되어 보안 원칙이 깨진다.
// 그래서 이 대시보드는 항상 게이트웨이 앞단에 서는 얇은 Python 브리지
// (chat_bridge.py, 아래 안내 참고)를 통해서만 LLM 파이프라인을 태운다.
const CHAT_ENDPOINT = "http://localhost:8000/chat";

const chatLog = document.getElementById("chat-log");
const chatInput = document.getElementById("chat-text");
const chatSend = document.getElementById("chat-send");
const sessionList = document.getElementById("session-list");
const sessionCount = document.getElementById("session-count");
const gwStatus = document.getElementById("gw-status");

function clearEmptyHint(container) {
  const hint = container.querySelector(".empty-hint");
  if (hint) hint.remove();
}

function appendUserMessage(text) {
  clearEmptyHint(chatLog);
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble"></div>`;
  div.querySelector(".bubble").textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function appendAgentMessage({ statusText, statusClass, resultText, errorText, sessionId }) {
  clearEmptyHint(chatLog);
  const div = document.createElement("div");
  div.className = "msg agent";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = statusText;
  div.appendChild(bubble);

  if (resultText) {
    const code = document.createElement("div");
    code.className = "code";
    code.textContent = resultText;
    div.appendChild(code);
  }
  if (errorText) {
    const code = document.createElement("div");
    code.className = "code";
    code.style.color = "#f85149";
    code.textContent = errorText;
    div.appendChild(code);
  }
  const pill = document.createElement("div");
  pill.className = `status-pill ${statusClass}`;
  pill.textContent = statusClass;
  div.appendChild(pill);

  if (sessionId) {
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = `session: ${sessionId}`;
    div.appendChild(meta);
  }

  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = "";
  chatSend.disabled = true;

  appendUserMessage(text);
  appendAgentMessage({ statusText: "처리 중...", statusClass: "running" });
  const pendingNode = chatLog.lastElementChild;

  try {
    const resp = await fetch(CHAT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    const data = await resp.json();
    pendingNode.remove();

    if (data.status === "no_tool_call") {
      appendAgentMessage({ statusText: data.raw_output || "(도구 호출 없음)", statusClass: "completed" });
    } else {
      appendAgentMessage({
        statusText: `실행 완료 (${data.status})`,
        statusClass: data.status,
        resultText: data.result,
        errorText: data.error,
        sessionId: data.session_id,
      });
    }
  } catch (e) {
    pendingNode.remove();
    appendAgentMessage({
      statusText: "chat_bridge.py에 연결할 수 없습니다. 아래 안내를 참고해 브리지를 먼저 실행해주세요.",
      statusClass: "failed",
    });
  } finally {
    chatSend.disabled = false;
    chatInput.focus();
  }
}

chatSend.addEventListener("click", sendChat);
chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });

// ---------------- 모니터링 패널 갱신 ----------------
function renderSessions(sessions) {
  sessionCount.textContent = `${sessions.length}건`;
  if (sessions.length === 0) {
    sessionList.innerHTML = '<div class="empty-hint">아직 실행된 세션이 없습니다.</div>';
    return;
  }
  sessionList.innerHTML = "";
  for (const s of sessions) {
    const card = document.createElement("div");
    card.className = "session-card";
    const started = new Date(s.started_at).toLocaleTimeString("ko-KR");
    card.innerHTML = `
      <div class="row1">
        <span class="sid">${s.id.slice(0, 8)}...</span>
        <span class="status-pill ${s.status}">${s.status}</span>
      </div>
      <div class="tool">${s.tool || "-"}</div>
      <div class="detail">시작: ${started}${s.result ? "\n결과: " + s.result.slice(0, 120) : ""}${s.error ? "\n오류: " + s.error.slice(0, 120) : ""}</div>
    `;
    sessionList.appendChild(card);
  }
}

async function pollSessions() {
  try {
    const resp = await fetch(`${GATEWAY}/v1/sessions/all`);
    const data = await resp.json();
    renderSessions(data || []);
    gwStatus.textContent = "연결됨";
  } catch (e) {
    gwStatus.textContent = "연결 안 됨";
  }
}

pollSessions();
setInterval(pollSessions, 1500);
</script>
</body>
</html>
